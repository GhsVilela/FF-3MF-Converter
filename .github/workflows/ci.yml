name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build packages
        run: npm run build:packages

      - name: Verify profile data
        run: npm run profiles:verify

      - name: Test
        run: npm test

      - name: Build all workspaces
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  portable:
    name: Portable executable build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build portable archives
        run: npm run build:portable

      - name: Verify archives
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd build/artifacts
          sha256sum -c SHA256SUMS.txt
          python3 -c "import zipfile; z=zipfile.ZipFile('FF-3MF-Converter-${VERSION}-win-x64.zip'); assert z.testzip() is None; assert z.read('FF-3MF-Converter-${VERSION}-win-x64/FF-3MF.exe')[:2] == b'MZ'; print('Windows zip and PE launcher OK')"
          python3 -c "import zipfile; z=zipfile.ZipFile('FF-3MF-Converter-${VERSION}-win-x64.zip'); z.extract('FF-3MF-Converter-${VERSION}-win-x64/FF-3MF.exe', '/tmp/ff3mf-win')"
          objdump -h "/tmp/ff3mf-win/FF-3MF-Converter-${VERSION}-win-x64/FF-3MF.exe" | grep -q '\.rsrc'
          file "FF-3MF-Converter-${VERSION}-win-x64.zip"
          tar -tzf "FF-3MF-Converter-${VERSION}-linux-x64.tar.gz" >/dev/null

      - name: Smoke-test Linux executable
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p /tmp/ff3mf-portable /tmp/ff3mf-data
          tar -xzf "build/artifacts/FF-3MF-Converter-${VERSION}-linux-x64.tar.gz" -C /tmp/ff3mf-portable
          cd "/tmp/ff3mf-portable/FF-3MF-Converter-${VERSION}-linux-x64"
          ./ff3mf --no-browser --port 8098 --data-dir /tmp/ff3mf-data >/tmp/ff3mf-portable.log 2>&1 &
          echo $! >/tmp/ff3mf-portable.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8098/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8098/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8098/
          kill "$(cat /tmp/ff3mf-portable.pid)"

  docker:
    name: Docker build test
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ff-3mf-converter:test
          build-args: |
            VERSION=ci
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || 'unknown' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [quality, e2e, portable, docker]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ] || [ "${{ needs.portable.result }}" != "success" ] || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "Build or tests failed"
            exit 1
          fi
          echo "All checks passed"
