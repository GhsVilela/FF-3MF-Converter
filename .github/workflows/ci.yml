name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build packages
        run: npm run build:packages

      - name: Verify profile data
        run: npm run profiles:verify

      - name: Test
        run: npm test

      - name: Build all workspaces
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  portable:
    name: Portable executable build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build portable archives
        run: npm run build:portable

      - name: Verify archives
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd build/artifacts
          sha256sum -c SHA256SUMS.txt
          python3 -c "import zipfile; z=zipfile.ZipFile('FF-3MF-Converter-${VERSION}-win-x64.zip'); assert z.testzip() is None; assert z.read('FF-3MF-Converter-${VERSION}-win-x64/FF-3MF.exe')[:2] == b'MZ'; print('Windows zip and PE launcher OK')"
          python3 -c "import zipfile; z=zipfile.ZipFile('FF-3MF-Converter-${VERSION}-win-x64.zip'); z.extract('FF-3MF-Converter-${VERSION}-win-x64/FF-3MF.exe', '/tmp/ff3mf-win')"
          objdump -h "/tmp/ff3mf-win/FF-3MF-Converter-${VERSION}-win-x64/FF-3MF.exe" | grep -q '\.rsrc'
          file "FF-3MF-Converter-${VERSION}-win-x64.zip"
          tar -tzf "FF-3MF-Converter-${VERSION}-linux-x64.tar.gz" >/dev/null
          for ARCH in arm64 x64; do
            mkdir -p "/tmp/ff3mf-macos-${ARCH}"
            tar -xzf "FF-3MF-Converter-${VERSION}-macos-${ARCH}.tar.gz" -C "/tmp/ff3mf-macos-${ARCH}" --strip-components=1
            file "/tmp/ff3mf-macos-${ARCH}/ff3mf" | grep -q 'Mach-O 64-bit'
            test -x "/tmp/ff3mf-macos-${ARCH}/ff3mf"
          done
          file /tmp/ff3mf-macos-arm64/ff3mf | grep -q 'arm64'
          file /tmp/ff3mf-macos-x64/ff3mf | grep -q 'x86_64'
          for ARCHIVE in \
            "FF-3MF-Converter-${VERSION}-linux-x64.tar.gz" \
            "FF-3MF-Converter-${VERSION}-macos-arm64.tar.gz" \
            "FF-3MF-Converter-${VERSION}-macos-x64.tar.gz"; do
            if tar -tvzf "$ARCHIVE" | grep -q ' -> '; then
              echo "Unexpected symlink in $ARCHIVE"
              exit 1
            fi
          done
          python3 -c "import stat, zipfile; z=zipfile.ZipFile('FF-3MF-Converter-${VERSION}-win-x64.zip'); bad=[i.filename for i in z.infolist() if stat.S_ISLNK(i.external_attr >> 16)]; assert not bad, bad; print('Windows zip has no symlinks')"

      - name: Smoke-test Linux executable
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p /tmp/ff3mf-portable /tmp/ff3mf-data
          tar -xzf "build/artifacts/FF-3MF-Converter-${VERSION}-linux-x64.tar.gz" -C /tmp/ff3mf-portable
          cd "/tmp/ff3mf-portable/FF-3MF-Converter-${VERSION}-linux-x64"
          ./ff3mf --no-browser --port 8098 --data-dir /tmp/ff3mf-data >/tmp/ff3mf-portable.log 2>&1 &
          echo $! >/tmp/ff3mf-portable.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8098/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8098/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8098/
          kill "$(cat /tmp/ff3mf-portable.pid)"

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: portable-artifacts
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS executable smoke test
    runs-on: macos-latest
    needs: [portable]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download portable artifacts
        uses: actions/download-artifact@v8
        with:
          name: portable-artifacts
          path: build/artifacts

      - name: Smoke-test macOS executable
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$(uname -m)" in
            arm64) ARCH="arm64" ;;
            x86_64) ARCH="x64" ;;
            *) echo "Unsupported macOS runner architecture: $(uname -m)"; exit 1 ;;
          esac
          echo "Testing the ${ARCH} build on $(uname -m)"
          mkdir -p /tmp/ff3mf-macos /tmp/ff3mf-data
          tar -xzf "build/artifacts/FF-3MF-Converter-${VERSION}-macos-${ARCH}.tar.gz" -C /tmp/ff3mf-macos --strip-components=1
          cd /tmp/ff3mf-macos
          ./ff3mf --no-browser --port 8099 --data-dir /tmp/ff3mf-data >/tmp/ff3mf-macos.log 2>&1 &
          echo $! >/tmp/ff3mf-macos.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8099/
          kill "$(cat /tmp/ff3mf-macos.pid)"

  docker:
    name: Docker build test
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ff-3mf-converter:test
          build-args: |
            VERSION=ci
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || 'unknown' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [quality, e2e, portable, macos, docker]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ] || [ "${{ needs.portable.result }}" != "success" ] || [ "${{ needs.macos.result }}" != "success" ] || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "Build or tests failed"
            exit 1
          fi
          echo "All checks passed"
