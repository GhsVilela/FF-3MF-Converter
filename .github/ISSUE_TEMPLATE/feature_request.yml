name: Feature request
description: Suggest a converter, UI or deployment improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conversion
        - UI
        - API / CLI
        - Deployment
        - Documentation
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Printer, slicer, example files or constraints. Do not attach private models.
